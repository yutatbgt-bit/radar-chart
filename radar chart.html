<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;">
  <title>radar chart</title>
  <meta name="description" content="全24店舗の売上実績KPI（売上高、客数、打数、客単価、一品単価の比較日比）をレーダーチャートとテーブルの1セットで表示する4列カンバンビュー">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ヘッダーエリア -->
  <header class="app-header">
    <div class="header-title-group">
      <h1 id="app-title">radar chart</h1>
    </div>

    <div class="header-controls">
      <div class="legend-bar" role="region" aria-label="チャート凡例">
        <div class="legend-item">
          <span class="legend-dot-actual"></span>
          <span>実績値</span>
        </div>
        <div class="legend-item">
          <span class="legend-dot-benchmark"></span>
          <span>基準線 (100%)</span>
        </div>
      </div>

      <!-- 読み込みボタン周辺 ドロップ＆ファイル選択ゾーン -->
      <div id="csv-drop-zone" class="header-drop-zone" role="region" aria-label="CSV読み込みドロップエリア">
        <input type="file" id="csv-file-input" class="file-upload-input" accept=".csv,text/csv">
        <label for="csv-file-input" class="drop-zone-label" tabindex="0" role="button" aria-label="CSVファイル選択 / ドロップ">
          <div class="drop-zone-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
          </div>
          <span class="drop-zone-main-text">CSVファイル選択 / ドロップ</span>
        </label>
      </div>
      <!-- クリアボタン（アイコン表示のみ） -->
      <button type="button" id="btn-clear-data" class="btn-clear" title="全店舗の数値をクリアします（店舗数・項目は維持されます）" aria-label="全店舗の数値をクリア">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>

      <!-- テーマ切り替えボタン（ライト/ダーク） アイコン表示のみ -->
      <button type="button" id="btn-theme-toggle" class="btn-theme-toggle" title="ライトモード/ダークモードを切り替えます" aria-label="ライトモードに切り替え" aria-pressed="false">
        <span class="theme-icon-container">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
      </button>

      <!-- 全画面表示切り替えボタン アイコン表示のみ -->
      <button type="button" id="btn-fullscreen-toggle" class="btn-fullscreen-toggle" title="全画面表示に切り替えます" aria-label="全画面表示に切り替え" aria-pressed="false">
        <span class="fullscreen-icon-container">
          <svg class="icon-maximize" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
          <svg class="icon-minimize" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
          </svg>
        </span>
      </button>
    </div>
  </header>

  <!-- 4列カンバンビューエリア -->
  <main>
    <div id="kanban-board" class="kanban-board" role="region" aria-label="4列店舗別カンバンボード">
      <!-- JavaScriptにより4列のカンバンカテゴリおよび店舗カードが安全に動的生成されます -->
    </div>
  </main>

  <!-- 店舗詳細ポップアップモーダル（拡大表示） -->
  <div id="store-modal-overlay" class="modal-overlay" aria-hidden="true" style="display: none;">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-store-name">
      <button type="button" id="modal-close-btn" class="modal-close-button" aria-label="閉じる">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <header class="modal-header">
        <div class="modal-header-info">
          <span id="modal-category-badge" class="kanban-category-badge"></span>
          <span id="modal-store-code" class="card-store-code"></span>
        </div>
        <h2 id="modal-store-name" class="modal-store-title"></h2>
      </header>

      <div class="modal-body-grid">
        <!-- 拡大レーダーチャート領域 -->
        <div class="modal-chart-section">
          <div id="modal-chart-container" class="modal-chart-wrapper"></div>
        </div>

        <!-- 拡大詳細データ表領域 -->
        <div class="modal-table-section">
          <div class="modal-section-title">比較日比 実績データ表</div>
          <div id="modal-table-container" class="modal-table-wrapper"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- トースト通知コンテナ -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- スクリプト読み込み（安全な分離設計・外部CDN不使用） -->
  <script src="js/config.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/table.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
